<style>
  :root {
    --sidebar-bg: #212631;
    --sidebar-color: #a6b0cf;
    --sidebar-active-bg: #2a303d;
    --sidebar-hover-color: #ffffff;
    --main-bg: #f3f4f7;
  }

  /* Sidebar Unificado con animación de colapso en PC */
  .sidebar {
    width: 256px;
    background-color: var(--sidebar-bg);
    transition: margin-left 0.25s ease-in-out;
  }

  /* Clase para ocultar sidebar en escritorio */
  .sidebar-collapsed {
    margin-left: -256px;
  }

  .sidebar-brand {
    padding: 1.25rem 1.5rem;
    font-weight: 700;
    font-size: 1.25rem;
    color: #fff;
    letter-spacing: 0.5px;
    background-color: rgba(0, 0, 0, 0.1);
  }

  .sidebar-title {
    padding: 1.25rem 1.5rem 0.5rem;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #636f83;
    letter-spacing: 0.5px;
  }

  .sidebar .nav-link {
    color: var(--sidebar-color);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    font-weight: 500;
    border-left: 3px solid transparent;
    transition: all 0.2s;
    cursor: pointer;
  }

  .sidebar .nav-link i {
    margin-right: 1rem;
    font-size: 1.1rem;
  }

  .sidebar .nav-link:hover {
    color: var(--sidebar-hover-color);
    background-color: var(--sidebar-active-bg);
  }

  .sidebar .nav-link.active {
    color: #fff;
    background-color: var(--sidebar-active-bg);
    border-left-color: #5856d6;
  }

  .sidebar .badge {
    font-size: 0.65rem;
    padding: 0.25em 0.5em;
  }

  /* Top Header */
  .header-nav {
    background-color: #fff;
    border-bottom: 1px solid #d8dbe0;
  }
</style>

<div x-data="dashboardComponent()" class="d-flex min-vh-100">
  <!-- SIDEBAR UNIFICADO -->
  <aside
    class="offcanvas-lg offcanvas-start sidebar text-bg-dark flex-shrink-0"
    tabindex="-1"
    id="mainSidebar"
    :class="{ 'sidebar-collapsed': isCollapsed }"
  >
    <div
      class="sidebar-brand d-flex align-items-center justify-content-between"
    >
      <div class="d-flex align-items-center">
        <i class="bi bi-hexagon-fill text-primary me-2 fs-4"></i>
        <span>CORE<span class="text-primary">UI</span></span>
      </div>
      <!-- Botón cerrar exclusivo para versión móvil -->
      <button
        type="button"
        class="btn-close btn-close-white d-lg-none"
        data-bs-dismiss="offcanvas"
        data-bs-target="#mainSidebar"
        aria-label="Close"
      ></button>
    </div>

    <div class="offcanvas-body p-0">
      <nav class="nav flex-column mt-2 w-100">
        <a
          class="nav-link"
          :class="{ 'active': activeVista === 'bienvenida' }"
          @click.prevent="navegarA('bienvenida')"
        >
          <i class="bi bi-speedometer2"></i> Dashboard
          <span class="badge bg-info ms-auto">NEW</span>
        </a>

        <div class="sidebar-title">UI Elements</div>
        <a
          class="nav-link"
          :class="{ 'active': activeVista === 'charts' }"
          @click.prevent="navegarA('charts')"
        >
          <i class="bi bi-pie-chart"></i> Charts
        </a>
        <a
          class="nav-link"
          :class="{ 'active': activeVista === 'components' }"
          @click.prevent="navegarA('components')"
        >
          <i class="bi bi-puzzle"></i> Components
        </a>

        <div class="sidebar-title">Extras</div>
        <a
          class="nav-link"
          :class="{ 'active': activeVista === 'docs' }"
          @click.prevent="navegarA('docs')"
        >
          <i class="bi bi-file-earmark-text"></i> Docs
        </a>

        <a class="nav-link text-danger mt-4" @click.prevent="logout()">
          <i class="bi bi-box-arrow-right me-2"></i> Salir
        </a>
      </nav>
    </div>
  </aside>

  <!-- ÁREA DE CONTENIDO PRINCIPAL -->
  <div class="w-100 min-vh-100 d-flex flex-column">
    <!-- Navbar Header Superior -->
    <header class="header-nav sticky-top">
      <div
        class="container-fluid px-4 py-2 d-flex align-items-center justify-content-between"
      >
        <!-- Botón Menú Hamburguesa -->
        <div class="d-flex align-items-center">
          <button
            class="btn btn-link text-dark p-0 me-3 fs-4"
            type="button"
            @click="toggleSidebar()"
          >
            <i class="bi bi-list"></i>
          </button>
        </div>

        <!-- Íconos de acceso rápido & Perfil -->
        <div class="d-flex align-items-center gap-3">
          <a href="#" class="text-secondary fs-5"><i class="bi bi-bell"></i></a>
          <a href="#" class="text-secondary fs-5"
            ><i class="bi bi-envelope-open"></i
          ></a>
          <div class="vr mx-1"></div>

          <!-- Avatar de Usuario -->
          <div class="dropdown">
            <a href="#" data-bs-toggle="dropdown">
              <img
                src="https://i.pravatar.cc/150?img=32"
                class="rounded-circle"
                width="36"
                height="36"
                alt="User"
              />
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
              <li>
                <a class="dropdown-item" href="#">
                  <i class="bi bi-person me-2"></i> Perfil
                </a>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a
                  class="dropdown-item text-danger"
                  href="#"
                  @click.prevent="logout()"
                >
                  <i class="bi bi-box-arrow-right me-2"></i> Salir
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Breadcrumbs dinámicos -->
      <div class="container-fluid px-4 py-2 bg-white border-top">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0 small text-capitalize">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item active" x-text="activeVista"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- Contenido Central / Subvistas Dinámicas -->
    <main id="App" class="container-fluid px-4 py-4 flex-grow-1"></main>
  </div>
</div>
