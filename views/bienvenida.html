<style>
  /* Centrado vertical base */
  .container-login100 {
    min-height: calc(100vh - 110px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    box-sizing: border-box;
  }

  /* Desplazamiento superior */
  .bloque-bienvenida {
    margin-top: -200px;
    width: 100%;
  }

  /* Texto Bienvenid@ estilo cool */
  .texto-bienvenida-cool {
    font-family:
      "Poppins",
      system-ui,
      -apple-system,
      sans-serif;
    font-size: 2.25rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 1.25rem;
    background: linear-gradient(135deg, #1f2937 0%, #4b5563 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Tarjeta contenedora de la imagen */
  .login100-form-avatar {
    display: block;
    width: 100%;
    max-width: 580px;
    margin: 0 auto;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    transition:
      transform 0.3s ease,
      box-shadow 0.3s ease;
  }

  .login100-form-avatar:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.12);
  }

  .login100-form-avatar img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    object-fit: cover;
  }

  /* Tag de versión */
  .texto-version {
    font-family:
      "Poppins",
      system-ui,
      -apple-system,
      sans-serif;
    font-weight: 500;
    color: #6b7280;
    margin-top: 1.5rem;
    display: inline-block;
    font-size: 0.85rem;
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    padding: 5px 18px;
    border-radius: 50px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
  }

  /* Responsive para pantallas móviles */
  @media (max-width: 768px) {
    .bloque-bienvenida {
      margin-top: 0;
    }
    .texto-bienvenida-cool {
      font-size: 1.75rem;
    }
  }
</style>

<div class="container-login100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 text-center bloque-bienvenida">
        <!-- Saludo minimalista y cool -->
        <h1 class="texto-bienvenida-cool">¡Bienvenid@!</h1>

        <!-- Banner / Logo -->
        <div class="login100-form-avatar overflow-hidden">
          <picture>
            <source
              media="(min-width: 769px)"
              srcset="assets/bienvenida.webp"
            />
            <img
              id="imgBienvenida"
              src="assets/bienvenida_android.webp"
              alt="Bienvenida EcoLNK"
              fetchpriority="high"
              loading="eager"
              width="1024"
              height="1024"
            />
          </picture>
        </div>

        <!-- Versión -->
        <div>
          <span id="version-label" class="texto-version">EcoLNK v2.6</span>
        </div>
      </div>
    </div>
  </div>
</div>
